<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>极简物品收纳盒</title>
  <link rel="manifest" href="manifest.json">
  <!-- Apple PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="收纳盒">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <link rel="stylesheet" href="app.css">
  
  <!-- Use CDN for pinyin-match and fallback in sw.js for caching -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-match/dist/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Main Screen Header -->
    <header>
      <h1>收纳助手</h1>
      <button class="btn btn-primary" id="btn-add-trigger">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        新增
      </button>
    </header>

    <!-- Search Input Bar -->
    <div class="search-container">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" id="search-input" placeholder="输入名称、拼音、首字母或位置搜索..." autocomplete="off">
      <button class="clear-search" id="clear-search">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Inventory / Stock List -->
    <main id="main-content">
      <div class="stock-grid" id="stock-list">
        <!-- Stock Cards will be generated dynamically here -->
      </div>
      
      <!-- Empty State -->
      <div class="empty-state" id="empty-state" style="display: none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line>
        </svg>
        <p>暂无收纳记录，点击上方“新增”开始吧！</p>
      </div>
    </main>
  </div>

  <!-- 1. ADD / CONTINUOUS ADD MODAL OVERLAY -->
  <div class="modal-overlay" id="add-modal" data-close-on-click-outside="true">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-nav">
          <button class="btn btn-secondary" id="btn-session-prev" style="padding: 6px 12px; font-size: 14px;">上一条</button>
          <span id="session-indicator" style="font-size: 13px; color: var(--text-secondary);">1/1</span>
          <button class="btn btn-secondary" id="btn-session-next" style="padding: 6px 12px; font-size: 14px;">下一条</button>
        </div>
        <button class="btn btn-primary" id="btn-session-done" style="padding: 6px 14px; font-size: 14px;">完成</button>
      </div>

      <form id="add-item-form" onsubmit="return false;">
        <!-- Two photo slots (Far, Close) -->
        <div class="photo-upload-grid">
          <!-- Close shot (Cover) -->
          <div class="photo-uploader" id="uploader-close">
            <input type="file" id="file-close" accept="image/*" style="display: none;">
            <div class="uploader-inner" id="inner-close">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle>
              </svg>
              <span>近景照 (物品细节)</span>
            </div>
            <img class="preview-img" id="prev-close" style="display: none;">
            <button class="btn-remove-photo" id="btn-remove-close" style="display: none;" type="button">×</button>
          </div>
          
          <!-- Far shot (Storage Area) -->
          <div class="photo-uploader" id="uploader-far">
            <input type="file" id="file-far" accept="image/*" style="display: none;">
            <div class="uploader-inner" id="inner-far">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>远景照 (存放区域)</span>
            </div>
            <img class="preview-img" id="prev-far" style="display: none;">
            <button class="btn-remove-photo" id="btn-remove-far" style="display: none;" type="button">×</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-name">物品名称 / 描述</label>
          <input type="text" class="form-input" id="input-name" placeholder="请输入物品名字或简要描述" autocomplete="off">
        </div>

        <div class="form-group">
          <label class="form-label" for="input-qty">数量</label>
          <input type="number" class="form-input" id="input-qty" placeholder="留空或输入数字" min="0">
        </div>

        <div class="form-group">
          <label class="form-label" for="input-location">存放位置</label>
          <input type="text" class="form-input" id="input-location" placeholder="例如：客厅电视柜左抽屉" autocomplete="off">
        </div>
      </form>
    </div>
  </div>

  <!-- 2. DETAIL DIALOG OVERLAY -->
  <div class="modal-overlay" id="detail-modal" data-close-on-click-outside="true">
    <div class="modal-content" style="padding-top: 24px;">
      <!-- Close button on top right of modal -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-size: 20px; font-weight: 700;">物品详情</h3>
        <button class="btn btn-secondary" id="btn-detail-close" style="padding: 6px 12px; font-size: 14px;">关闭</button>
      </div>

      <!-- Photos view -->
      <div class="detail-photos">
        <!-- Close shot view -->
        <div class="detail-photo-box">
          <img class="detail-img" id="detail-img-close">
          <div class="card-placeholder" id="detail-img-close-placeholder">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span>无近景照</span>
          </div>
        </div>
        
        <!-- Far shot view -->
        <div class="detail-photo-box">
          <img class="detail-img" id="detail-img-far">
          <div class="card-placeholder" id="detail-img-far-placeholder">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>无远景照</span>
          </div>
        </div>
      </div>

      <!-- Info items -->
      <div class="detail-info-row">
        <div class="detail-info-label">名称</div>
        <div class="detail-info-value" id="detail-val-name">--</div>
      </div>
      <div class="detail-info-row">
        <div class="detail-info-label">数量</div>
        <div class="detail-info-value" id="detail-val-qty">--</div>
      </div>
      <div class="detail-info-row">
        <div class="detail-info-label">位置</div>
        <div class="detail-info-value" id="detail-val-location">--</div>
      </div>

      <!-- Actions -->
      <div class="detail-actions">
        <button class="btn btn-secondary btn-full-width" id="btn-detail-edit">编辑此物品</button>
      </div>
    </div>
  </div>

  <!-- 3. EDIT MODAL OVERLAY -->
  <div class="modal-overlay" id="edit-modal" data-close-on-click-outside="true">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
        <h3 class="modal-title">编辑物品</h3>
        <div>
          <button class="btn btn-secondary" id="btn-edit-cancel" style="padding: 6px 12px; font-size: 14px; margin-right: 8px;">取消</button>
          <button class="btn btn-primary" id="btn-edit-save" style="padding: 6px 14px; font-size: 14px;">保存</button>
        </div>
      </div>

      <form id="edit-item-form" onsubmit="return false;">
        <!-- Two photo slots (Far, Close) for editing -->
        <div class="photo-upload-grid">
          <!-- Close shot (Cover) -->
          <div class="photo-uploader" id="edit-uploader-close">
            <input type="file" id="edit-file-close" accept="image/*" style="display: none;">
            <div class="uploader-inner" id="edit-inner-close">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle>
              </svg>
              <span>更换近景照</span>
            </div>
            <img class="preview-img" id="edit-prev-close" style="display: none;">
            <button class="btn-remove-photo" id="edit-btn-remove-close" style="display: none;" type="button">×</button>
          </div>
          
          <!-- Far shot (Storage Area) -->
          <div class="photo-uploader" id="edit-uploader-far">
            <input type="file" id="edit-file-far" accept="image/*" style="display: none;">
            <div class="uploader-inner" id="edit-inner-far">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>更换远景照</span>
            </div>
            <img class="preview-img" id="edit-prev-far" style="display: none;">
            <button class="btn-remove-photo" id="edit-btn-remove-far" style="display: none;" type="button">×</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-input-name">物品名称 / 描述</label>
          <input type="text" class="form-input" id="edit-input-name" placeholder="请输入物品名字" autocomplete="off">
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-input-qty">数量</label>
          <input type="number" class="form-input" id="edit-input-qty" placeholder="留空或输入数字" min="0">
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-input-location">存放位置</label>
          <input type="text" class="form-input" id="edit-input-location" placeholder="例如：客厅电视柜左抽屉" autocomplete="off">
        </div>

        <!-- Delete Item Button -->
        <button class="btn btn-danger btn-full-width" id="btn-edit-delete" style="margin-top: 16px;" type="button">删除此物品</button>
      </form>
    </div>
  </div>

  <!-- Toast Element -->
  <div class="toast" id="toast">提示信息</div>

  <!-- Scripts -->
  <script src="search.js"></script>
  <script src="app.js"></script>
</body>
</html>
