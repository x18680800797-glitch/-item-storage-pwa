<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#34c759" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e5e5ea" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Storage Box Icon -->
  <g filter="url(#shadow)">
    <!-- Box Base -->
    <path d="M128 200 L384 200 L352 400 L160 400 Z" fill="url(#boxGrad)" />
    <!-- Box Lid -->
    <rect x="112" y="160" width="288" height="40" rx="8" fill="#ffffff" />
    <!-- Box Handle / Label Slot -->
    <rect x="216" y="260" width="80" height="24" rx="12" fill="#8e8e93" opacity="0.3" />
    <!-- Small Divider line on the handle to represent details -->
    <path d="M236 272 H276" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Mini magnifying glass representing searching items -->
  <circle cx="340" cy="320" r="30" stroke="#ffffff" stroke-width="12" fill="none" />
  <line x1="361" y1="341" x2="395" y2="375" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
</svg>